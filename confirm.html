<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirm your call | Vaishnavi Kumari</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Karla:wght@400;700;800&family=Gochi+Hand&display=swap">
<style>
:root{--bg:#D7E5FF;--ink:#13204A;--soft:#43507A;--cobalt:#2446C7;--on-cobalt:#FFF3C4;--sun:#FFE27A;--rani:#D61F69;--paper:#FFFDF3;--line:#AFC4EE;--ok:#1d7a3e;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0C1430;--ink:#EEF2FF;--soft:#A9B6DA;--cobalt:#3358E0;--sun:#FFD95C;--rani:#FF4D8E;--paper:#18244A;--line:#2C3B6B;--ok:#7fd69a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Karla",system-ui,sans-serif;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
main{display:grid;justify-items:center;text-align:center;gap:16px;width:100%;max-width:520px;background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--cobalt);padding:32px 22px}
img{width:min(190px,60%);height:auto;rotate:-3deg;filter:drop-shadow(0 10px 14px rgba(20,30,80,.22))}
.tag{font-family:"Gochi Hand",cursive;color:var(--rani);font-size:1.4rem;line-height:1}
h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.08;margin:0;text-wrap:balance}
h1.ok{color:var(--ok)}
p{margin:0;color:var(--soft);font-size:1.08rem;line-height:1.6;max-width:42ch}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
button,a.btn{font:inherit;font-weight:800;font-size:1.05rem;text-decoration:none;padding:12px 24px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);background:none;cursor:pointer;transition:translate .15s,box-shadow .15s}
button:hover:not(:disabled),a.btn:hover{translate:-2px -2px;box-shadow:4px 4px 0 var(--ink)}
.main{background:var(--cobalt);border-color:var(--ink);color:var(--on-cobalt)}
button:disabled{opacity:.6;cursor:wait}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img id="pic" src="stickers/d_calls.webp" width="346" height="420" alt="Vaishnavi on a call">
  <span class="tag" id="tag">one last step</span>
  <h1 id="title">Confirm your call with Vaishnavi</h1>
  <p id="msg">Press the button below to lock in your time. You’ll get a calendar invite with a Google Meet link right after.</p>
  <div class="row">
    <button type="button" class="main" id="go">Confirm my call</button>
    <a class="btn" id="home" href="./" hidden>Back to vaishnavikumari.com</a>
  </div>
</main>
<script src="booking-config.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), id = q.get('id'), t = q.get('t');
  var endpoint = (window.VK_BOOKING || {}).endpoint || '';
  var $ = function (x) { return document.getElementById(x); };
  // Keep the token out of the address bar and history once read
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  function show(state, title, msg) {
    var pics = { ok: ['wink.webp', 'Vaishnavi winking', 323, 348], bad: ['pout.webp', 'Vaishnavi pouting', 314, 338] };
    var p = pics[state === 'ok' ? 'ok' : 'bad'];
    $('pic').src = 'stickers/' + p[0]; $('pic').alt = p[1]; $('pic').width = p[2]; $('pic').height = p[3];
    $('tag').textContent = state === 'ok' ? 'see you there!' : 'hmm';
    $('title').textContent = title; $('title').className = state === 'ok' ? 'ok' : '';
    $('msg').textContent = msg;   // plain text only
    $('go').hidden = state !== 'retry'; $('go').disabled = false; $('go').textContent = 'Try again';
    $('home').hidden = false;
  }
  var strip = function (s) { var d = document.createElement('div'); d.innerHTML = String(s || ''); return (d.textContent || '').trim(); };

  if (!id || !t || !endpoint) {
    show('bad', 'Link not valid', !endpoint ? 'Online booking isn’t switched on yet. Please email Vaishnavi to set up a call.' : 'This confirmation link is incomplete. Please open it straight from the email.');
    return;
  }
  $('go').addEventListener('click', function () {
    $('go').disabled = true; $('go').textContent = 'Confirming…';
    fetch(endpoint + '?action=confirm&format=json&id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t))
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r && r.ok) show('ok', 'You’re booked!', strip(r.message) || 'A calendar invite with a Google Meet link is on its way to your inbox.');
        else show(r && r.code === 'busy' ? 'retry' : 'bad', (r && r.title) || 'Something went wrong', strip(r && r.message) || 'Please try again, or email Vaishnavi.');
      })
      .catch(function () { show('retry', 'Couldn’t reach the calendar', 'Please check your connection and press Try again. Your slot stays held for 15 minutes.'); });
  });
})();
</script>
</body>
</html>
