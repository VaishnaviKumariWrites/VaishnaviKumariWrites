<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Vaishnavi Kumari</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://vaishnavikumari.com/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Karla:wght@400;700;800&family=Gochi+Hand&display=swap">
<style>
:root{--bg:#D7E5FF;--ink:#13204A;--soft:#43507A;--cobalt:#2446C7;--sun:#FFE27A;--rani:#D61F69;--paper:#FFFDF3;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0C1430;--ink:#EEF2FF;--soft:#A9B6DA;--cobalt:#3358E0;--sun:#FFD95C;--rani:#FF4D8E;--paper:#18244A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Karla",system-ui,sans-serif;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
main{display:grid;justify-items:center;text-align:center;gap:18px;max-width:560px}
img{width:min(240px,70%);height:auto;rotate:-3deg;filter:drop-shadow(0 10px 14px rgba(20,30,80,.22))}
.code{font-family:"Gochi Hand",cursive;color:var(--rani);font-size:1.6rem;line-height:1}
h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.05;margin:0;text-wrap:balance}
mark{background:var(--sun);color:#1A1A3A;padding:0 .2em;border-radius:.3em}
p{margin:0;color:var(--soft);font-size:1.1rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
a.btn{font-weight:800;text-decoration:none;padding:12px 22px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);transition:translate .15s,box-shadow .15s}
a.btn:hover{translate:-2px -2px;box-shadow:4px 4px 0 var(--ink)}
a.btn.main{background:var(--cobalt);border-color:var(--cobalt);color:#FFF3C4}
a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="https://vaishnavikumari.com/stickers/daydream.webp" width="274" height="307" alt="Vaishnavi daydreaming with a heart in a thought bubble">
  <span class="code">404 · page not found</span>
  <h1>This page went out to <mark>get momos.</mark></h1>
  <p>It's not here, and it's not ranking either. The link might be old, or there's a typo in the address.</p>
  <div class="row">
    <a class="btn main" href="https://vaishnavikumari.com/">Take me home</a>
    <a class="btn" href="https://vaishnavikumari.com/#work">See her writing</a>
  </div>
</main>
</body>
</html>
